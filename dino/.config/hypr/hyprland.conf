##########################
### DF HYPRLAND CONFIG ###
##########################

## MONITORS ##
source = monitors.conf

## PROGRAMS ##
# https://wiki.hypr.land/Configuring/Keywords/
$terminal = kitty
$fileManager = $terminal -e yazi 
$menu = rofi
$drunArgs = -show drun -replace -i
$runArgs = -show combi -modes combi -combi-modes "drun,run" -replace -i
$filebrowserArgs = -show combi -modes combi -combi-modes "filebrowser,recursivebrowser" -replace -i -matching regex
$networkUI = kitty -e nmtui
$audioUI = kitty -e pulsemixer

## ENVIRONMENT VARIABLES, DECORATIONS, AND ANIMATIONS ##
source = aesthetics.conf

dwindle {
    preserve_split = true
}

## AUTOSTART ##
#exec-once = $terminal pipes.sh -f30 -r0
exec-once = waybar
exec-once = hyprpaper

## INPUT ##
# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:swapescape
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true             # tapping replaces pressing for most clicks
        tap-and-drag = true
        drag_lock = true
        clickfinger_behavior = false    # 1/2/3-finger physical click = left/right/middle, anywhere on the pad
        scroll_factor = 1.0             # tune; lower = slower scrolling
    }
    accel_profile = adaptive            # or "flat" for 1:1 feel
}

## KEYBINDINGS ##
source = keybindings.conf

## WINDOWS AND WORKSPACES ##
source = rules.conf

xwayland {
    enabled = true
}
exec-once = xrandr --output DP-1 --primary

exec = notify-send "Loaded $(hostname)"

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = NVD_BACKEND,direct
gesture = 3, horizontal, scale: 0.8, workspace
gestures {
    workspace_swipe_cancel_ratio = 0.15         # default 0.5
    workspace_swipe_min_speed_to_force = 30     # default 30
    workspace_swipe_distance = 400              # default 300
    workspace_swipe_forever = true
    workspace_swipe_create_new = false
}
