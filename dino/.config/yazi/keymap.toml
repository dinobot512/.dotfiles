[[mgr.prepend_keymap]]
on   = "l"
run  = "enter"
desc = "Enter directory (files ignored)"

[[mgr.prepend_keymap]]
on   = "o"
run  = "plugin smart-enter"
desc = "Enter directory or open file"

[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter directory or open file"

[[mgr.prepend_keymap]]
on   = "d"
run  = "remove"
desc = "Trash selected files"

[[mgr.prepend_keymap]]
on   = "D"
run  = "remove --permanently"
desc = "Delete selected files permanently"
